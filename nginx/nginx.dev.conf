upstream nexuslearn_api {
    least_conn;
    server server_node_1:5000 max_fails=3 fail_timeout=10s;
    server server_node_2:5000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream nexuslearn_client {
    server client:80;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://nexuslearn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /socket.io/ {
        proxy_pass http://nexuslearn_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://nexuslearn_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://nexuslearn_client;
        proxy_set_header Host $host;
    }
}
